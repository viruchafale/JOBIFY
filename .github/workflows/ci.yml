name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            services/*/package.json
            frontend/package.json

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/jobify_test
        run: node database/scripts/migrate.mjs up

      - name: Install and Verify Gateway Service
        run: |
          cd services/gateway
          npm ci || npm install
          npx tsc --noEmit
          npm test
          npm run build

      - name: Install and Verify Auth Service
        env:
          JWT_SECRET: ci_test_secret_key_12345
          SESSION_SECRET: ci_session_secret_key_12345
        run: |
          cd services/auth
          npm ci || npm install
          npx tsc --noEmit
          npm test
          npm run build

      - name: Install and Verify User Service
        env:
          JWT_SECRET: ci_test_secret_key_12345
        run: |
          cd services/user
          npm ci || npm install
          npx tsc --noEmit
          npm test
          npm run build

      - name: Install and Verify Job Service
        env:
          JWT_SECRET: ci_test_secret_key_12345
        run: |
          cd services/job
          npm ci || npm install
          npx tsc --noEmit
          npm test
          npm run build

      - name: Install and Verify Utils Service
        env:
          JWT_SECRET: ci_test_secret_key_12345
        run: |
          cd services/utils
          npm ci || npm install
          npx tsc --noEmit
          npm test
          npm run build

      - name: Install and Build Frontend
        env:
          NEXT_PUBLIC_GATEWAY_URL: http://localhost:5000
        run: |
          cd frontend
          npm ci || npm install
          npx tsc --noEmit
          npm run build
